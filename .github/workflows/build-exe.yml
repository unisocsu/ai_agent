name: Build Windows EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore WindowsAIAgent/WindowsAIAgent.csproj

      - name: Build
        run: dotnet build WindowsAIAgent/WindowsAIAgent.csproj -c Release --no-restore

      - name: Publish Windows x64 EXE
        run: >
          dotnet publish WindowsAIAgent/WindowsAIAgent.csproj
          -c Release
          -r win-x64
          --self-contained false
          -p:PublishSingleFile=true
          -p:EnableCompressionInSingleFile=true
          -o publish

      - name: Package
        shell: pwsh
        run: Compress-Archive -Path publish/* -DestinationPath WindowsAIAgent-win-x64.zip

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: WindowsAIAgent-win-x64
          path: publish/

      - name: Upload ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: WindowsAIAgent-win-x64-zip
          path: WindowsAIAgent-win-x64.zip

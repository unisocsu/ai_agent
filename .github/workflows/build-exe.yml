name: Build Windows EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore WindowsAIAgent/WindowsAIAgent.csproj

      - name: Build
        run: dotnet build WindowsAIAgent/WindowsAIAgent.csproj -c Release --no-restore

      - name: Publish Windows x64 EXE
        run: >
          dotnet publish WindowsAIAgent/WindowsAIAgent.csproj
          -c Release
          -r win-x64
          --self-contained false
          -p:PublishSingleFile=true
          -o publish

      - name: Ensure WebView2 native loader is packaged
        shell: pwsh
        run: |
          $loader = Get-ChildItem "$env:USERPROFILE\\.nuget\\packages\\microsoft.web.webview2" -Filter WebView2Loader.dll -Recurse -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match "\\runtimes\\win-x64\\native\\WebView2Loader\\.dll$" } |
            Select-Object -First 1

          if (-not $loader) {
            $loader = Get-ChildItem "$env:USERPROFILE\\.nuget\\packages\\microsoft.web.webview2" -Filter WebView2Loader.dll -Recurse -ErrorAction SilentlyContinue |
              Where-Object { $_.FullName -match "win-x64" } |
              Select-Object -First 1
          }

          if (-not $loader) {
            throw "WebView2Loader.dll was not found in the restored Microsoft.Web.WebView2 package."
          }

          Copy-Item $loader.FullName "publish\\WebView2Loader.dll" -Force
          Write-Host "Packaged WebView2Loader.dll from $($loader.FullName)" 

      - name: Verify publish contents
        shell: pwsh
        run: |
          if (-not (Test-Path "publish\\WindowsAIAgent.exe")) { throw "WindowsAIAgent.exe is missing from publish." }
          if (-not (Test-Path "publish\\WebView2Loader.dll")) { throw "WebView2Loader.dll is missing from publish." }
          Get-ChildItem publish | Select-Object Name,Length

      - name: Package
        shell: pwsh
        run: Compress-Archive -Path publish/* -DestinationPath WindowsAIAgent-win-x64.zip

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: WindowsAIAgent-win-x64
          path: publish/

      - name: Upload ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: WindowsAIAgent-win-x64-zip
          path: WindowsAIAgent-win-x64.zip

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v1.0.${{ github.run_number }}"
          gh release create $tag `
            "publish/WindowsAIAgent.exe" `
            "WindowsAIAgent-win-x64.zip" `
            --title "Windows AI Agent $tag" `
            --generate-notes
